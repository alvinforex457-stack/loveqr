<!doctype html><html><head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — Scan2Gift</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html">🎁 Scan2Gift</a><span class="eyebrow">CREATE ACCOUNT</span><h1>Start making beautiful gifts.</h1><form id="registerForm"><label>Your name<input id="name" required></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn btn-primary" type="submit">Create account</button><div id="msg" class="status"></div><button type="button" class="btn btn-light" id="apiTest"></button></form><p>Already registered? <a href="login.html">Sign in</a></p></div></main><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/auth.js"></script><script>document.getElementById("apiTest")?.addEventListener("click",async()=>{const m=document.getElementById("msg");try{const r=await fetch((window.SCAN2GIFT_CONFIG||{}).API_URL);const t=await r.text();m.className="status";m.textContent=t.slice(0,220)}catch(e){m.className="status error";m.textContent=e.message}})</script></body></html>
